[project]
name = "autoclip"
version = "0.1.0"
description = "Démon multi-bots qui découpe des vidéos en Shorts et les publie selon un planning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faster-whisper>=1.0",
    "yt-dlp>=2025.1.1",
    "keyring>=25",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
autoclip = "autoclip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoclip*"]

[tool.setuptools.package-data]
autoclip = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
